name: Build and publish a Docker image

on:
  workflow_dispatch:
    inputs:
      mautic_version:
        description: 'Mautic version (has to be a valid version from `mautic/recommended-project`)'
        required: true
      overwrite_latest_major:
        type: boolean
        description: "Overwrite latest major tag (e.g. `5`). Check only when releasing the latest major release."
      overwrite_latest_minor:
        type: boolean
        description: "Overwrite latest minor tag (e.g. `5.0`). Check only when releasing the latest release within a minor version."
      tag_as_latest:
        type: boolean
        description: "Tag this release as latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # This typically resolves to owner/repository

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [apache, fpm]
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Check out the repository so the Dockerfile and build context are available.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate Docker metadata (tags, labels, etc.) using your inputs.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            mautic/mautic
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.mautic_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.mautic_version }},enable=${{ inputs.overwrite_latest_minor }}
            type=semver,pattern={{major}},value=${{ inputs.mautic_version }},enable=${{ inputs.overwrite_latest_major }}
            type=raw,value=latest,enable=${{ inputs.tag_as_latest && matrix.image_type == 'apache' }},suffix=
          flavor: |
            latest=false
            prefix=
            suffix=-${{ matrix.image_type }}

      # 3. Set up QEMU for multi-platform builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Docker Buildx which is needed for advanced build features.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry (GHCR) using the provided GITHUB_TOKEN.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build and push the Docker image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ${{ matrix.image_type }}/Dockerfile  # Adjust this path if your Dockerfiles are elsewhere.
          context: .
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.image_type }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.image_type }},mode=max,image-manifest=true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAUTIC_VERSION=${{ inputs.mautic_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
